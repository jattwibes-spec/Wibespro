name: Build Android APK & Publish Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Prepare Keystores
        run: |
          yes | sdkmanager --licenses || true
          chmod +x ./gradlew
          touch .env

          # Generate release keystore if missing
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass wibesprotect123 -keypass wibesprotect123 -dname "CN=WibesProtect, OU=Security, O=Jattwibes, L=City, S=State, C=US"
          fi

          # Generate debug keystore if missing
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"
          fi

          # Ensure keystores exist in root AND in app/ directory where Gradle subproject may resolve relative paths
          mkdir -p app
          cp my-upload-key.jks app/my-upload-key.jks
          cp debug.keystore app/debug.keystore

          ls -lh my-upload-key.jks app/my-upload-key.jks

      - name: Build Android APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: wibesprotect123
          KEY_PASSWORD: wibesprotect123
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        id: prepare_apks
        run: |
          mkdir -p release_assets
          echo "=== Found APKs ==="
          find app/build/outputs/apk/ -type f -name "*.apk"
          
          # Copy release APK
          REL_APK=$(find app/build/outputs/apk/ -type f -name "*release*.apk" | head -n 1)
          if [ -n "$REL_APK" ]; then
            cp "$REL_APK" release_assets/WibesProtect-release.apk
            echo "Copied release APK from $REL_APK"
          fi

          # Copy debug APK
          DBG_APK=$(find app/build/outputs/apk/ -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$DBG_APK" ]; then
            cp "$DBG_APK" release_assets/WibesProtect-debug.apk
            echo "Copied debug APK from $DBG_APK"
          fi

          ls -lh release_assets/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WibesProtect-APKs
          path: release_assets/*

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag_info.outputs.tag }}"
          TITLE="Wibes Protect ${TAG}"
          cat << 'NOTES' > release_notes.md
          # 🛡️ WIBES PROTECT - Official Android Release

          Official Android APK package build for **Wibes Protect** (${TAG}).

          ### 📦 Download Assets:
          - **[WibesProtect-release.apk](WibesProtect-release.apk)**: Production signed APK (RSA 2048 upload key, Signature Scheme v2/v3).
          - **[WibesProtect-debug.apk](WibesProtect-debug.apk)**: Debug build with diagnostics enabled.

          ### 🚀 Features Included:
          - Dex Bytecode Obfuscation & Transformation
          - Anti-Tamper & Checksum Integrity Verification
          - Anti-Debugging & Tracer Detection
          - String Encryption with Dynamic Keys
          - Built with Jetpack Compose & Gradle
          NOTES

          echo "Publishing release $TAG with title: $TITLE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading/updating assets..."
            gh release upload "$TAG" release_assets/* --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" release_assets/* --title "$TITLE" --notes-file release_notes.md
          fi
