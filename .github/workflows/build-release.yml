name: Build Android APK & Publish Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Prepare Keystores
        run: |
          yes | sdkmanager --licenses || true
          chmod +x ./gradlew
          touch .env
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass wibesprotect123 -keypass wibesprotect123 -dname "CN=WibesProtect, OU=Security, O=Jattwibes, L=City, S=State, C=US"
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"
          fi

      - name: Build Android APKs
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: wibesprotect123
          KEY_PASSWORD: wibesprotect123
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        id: prepare_apks
        run: |
          mkdir -p release_assets
          find app/build/outputs/apk/ -type f -name "*.apk"
          
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk release_assets/WibesProtect-release.apk
            echo "Release APK copied."
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_assets/WibesProtect-debug.apk
            echo "Debug APK copied."
          fi

          if [ ! -f "release_assets/WibesProtect-release.apk" ]; then
            FIRST_REL=$(find app/build/outputs/apk/ -type f -name "*release*.apk" | head -n 1)
            if [ -n "$FIRST_REL" ]; then
              cp "$FIRST_REL" release_assets/WibesProtect-release.apk
            fi
          fi
          if [ ! -f "release_assets/WibesProtect-debug.apk" ]; then
            FIRST_DBG=$(find app/build/outputs/apk/ -type f -name "*debug*.apk" | head -n 1)
            if [ -n "$FIRST_DBG" ]; then
              cp "$FIRST_DBG" release_assets/WibesProtect-debug.apk
            fi
          fi

          ls -la release_assets/

      - name: Upload APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WibesProtect-APKs
          path: release_assets/*

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag_info.outputs.tag }}"
          TITLE="Wibes Protect ${TAG}"
          cat << 'NOTES' > release_notes.md
          ## Wibes Protect Official Release

          Official Android APK release for **Wibes Protect**.

          ### Included APK Packages:
          - **WibesProtect-release.apk**: Production release APK signed with upload keystore.
          - **WibesProtect-debug.apk**: Debug APK with debug symbols.

          Built with Gradle and published via GitHub Actions.
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" release_assets/* --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" release_assets/* --title "$TITLE" --notes-file release_notes.md
          fi
